{% extends "base.html" %}
{% block title %}Error {{ code }}{% endblock %}
{% block page_title %}Error {{ code }}{% endblock %}

{% block auth_content %}
<div class="auth-page">
  <div class="auth-card">
    <h1>{{ code }}</h1>
    <p class="muted">{{ message }}</p>
    <a class="btn btn-primary" href="{{ url_for('main.dashboard') if current_user.is_authenticated else url_for('auth.login') }}">Go back</a>
  </div>
</div>
{% endblock %}

{% block content %}
<div class="empty-state" style="padding:64px 24px;">
  <div class="empty-icon">!</div>
  <h2 style="margin:12px 0 4px;">Error {{ code }}</h2>
  <p class="muted">{{ message }}</p>
  <a class="btn btn-primary" href="{{ url_for('main.dashboard') }}">Back to dashboard</a>
</div>
{% endblock %}
